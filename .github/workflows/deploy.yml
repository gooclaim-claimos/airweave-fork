# .github/workflows/deploy.yml
#
# Build + push the datasources-backend and datasources-frontend images on
# every push to develop, then bump the image.tag in each chart's values.yaml
# and commit the bumps back. ArgoCD (gooclaim-claimos cluster, datasources
# namespace) watches the charts and rolls out automatically.
#
# What this does:
#   1. Compute next vX.Y.Z for backend and frontend independently (auto-bump
#      patch from current tag in values.yaml).
#   2. Build both images, push to gcdevacrcin001 ACR with the new vN tag +
#      a rolling `develop` tag.
#   3. Bump helm/datasources-backend/values.yaml and
#      helm/datasources-frontend/values.yaml `image.tag`.
#   4. Commit + push the bumps back to develop with `[skip ci]` so the
#      bump itself doesn't trigger another build loop.
#
# What this does NOT do:
#   * `helm upgrade` directly — ArgoCD handles rollout from the chart change.
#   * Build the Vespa chart on every push — Vespa has no Gooclaim image
#     (uses vespaengine/vespa:8 upstream) and its app-package is committed
#     in the chart; ArgoCD picks up chart edits as usual.
#
# Triggers:
#   push to develop      → build both, bump both, commit
#   workflow_dispatch    → same flow, manual rebuild
#
# Path filters keep the workflow quiet for docs / helm-only changes that
# do not change the runtime code.

name: Deploy (dev)

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'helm/**/values.yaml'
      - '**.md'
      - '.github/workflows/gooclaim-ci.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # let in-flight builds finish so a bump commit isn't lost

permissions:
  id-token: write   # Azure OIDC federation
  contents: write   # commit + push the values.yaml bump

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: dev
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Compute next backend tag (auto-bump patch)
        id: backend-tag
        run: |
          set -euo pipefail
          current=$(grep -E '^\s*tag:\s*' helm/datasources-backend/values.yaml \
            | head -1 \
            | sed -E 's/^\s*tag:\s*//' \
            | tr -d '"' \
            | tr -d "'")
          echo "Backend current tag: $current"
          # Accept either vX.Y.Z or vX.Y.Z-gck.N (Marketriangle's iterative
          # build naming during the 2026-06-15 ship). We bump the trailing
          # gck.N when present so manual + CI builds don't collide.
          if [[ "$current" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-gck\.([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
            patch="${BASH_REMATCH[2]}"
            next="${base}-gck.$((patch + 1))"
          elif [[ "$current" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            next="v${major}.${minor}.$((patch + 1))"
          else
            echo "::error::backend values.yaml tag '$current' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-gck.N"
            exit 1
          fi
          echo "Backend next tag: $next"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next"       >> "$GITHUB_OUTPUT"

      - name: Compute next frontend tag (auto-bump patch)
        id: frontend-tag
        run: |
          set -euo pipefail
          current=$(grep -E '^\s*tag:\s*' helm/datasources-frontend/values.yaml \
            | head -1 \
            | sed -E 's/^\s*tag:\s*//' \
            | tr -d '"' \
            | tr -d "'")
          echo "Frontend current tag: $current"
          if [[ "$current" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+)-gck\.([0-9]+)$ ]]; then
            base="${BASH_REMATCH[1]}"
            patch="${BASH_REMATCH[2]}"
            next="${base}-gck.$((patch + 1))"
          elif [[ "$current" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"
            next="v${major}.${minor}.$((patch + 1))"
          else
            echo "::error::frontend values.yaml tag '$current' is not vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-gck.N"
            exit 1
          fi
          echo "Frontend next tag: $next"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "next=$next"       >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/datasources-backend:${{ steps.backend-tag.outputs.next }}
            ${{ vars.ACR_LOGIN_SERVER }}/datasources-backend:develop
            ${{ vars.ACR_LOGIN_SERVER }}/datasources-backend:dev-latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ vars.ACR_LOGIN_SERVER }}/datasources-frontend:${{ steps.frontend-tag.outputs.next }}
            ${{ vars.ACR_LOGIN_SERVER }}/datasources-frontend:develop
            ${{ vars.ACR_LOGIN_SERVER }}/datasources-frontend:dev-latest
          build-args: |
            VITE_GOOCLAIM_MODE=true
            VITE_API_URL=https://sources.dev.gooclaim.com/api
            VITE_ENABLE_AUTH=false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Bump Helm tags in values.yaml
        if: github.event_name == 'push'
        env:
          BACKEND_NEXT: ${{ steps.backend-tag.outputs.next }}
          BACKEND_CURRENT: ${{ steps.backend-tag.outputs.current }}
          FRONTEND_NEXT: ${{ steps.frontend-tag.outputs.next }}
          FRONTEND_CURRENT: ${{ steps.frontend-tag.outputs.current }}
        run: |
          set -euo pipefail
          # Backend
          file=helm/datasources-backend/values.yaml
          sed -i -E "s|^(\s*tag:\s*)${BACKEND_CURRENT}(\s*)$|\1${BACKEND_NEXT}\2|" "$file"
          if ! grep -qE "^\s*tag:\s*${BACKEND_NEXT}\s*$" "$file"; then
            echo "::error::backend tag bump did not land"
            grep -n 'tag:' "$file" || true
            exit 1
          fi
          # Frontend
          file=helm/datasources-frontend/values.yaml
          sed -i -E "s|^(\s*tag:\s*)${FRONTEND_CURRENT}(\s*)$|\1${FRONTEND_NEXT}\2|" "$file"
          if ! grep -qE "^\s*tag:\s*${FRONTEND_NEXT}\s*$" "$file"; then
            echo "::error::frontend tag bump did not land"
            grep -n 'tag:' "$file" || true
            exit 1
          fi

      - name: Commit + push bumps back to develop
        if: github.event_name == 'push'
        env:
          BACKEND_NEXT: ${{ steps.backend-tag.outputs.next }}
          FRONTEND_NEXT: ${{ steps.frontend-tag.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/datasources-backend/values.yaml helm/datasources-frontend/values.yaml
          git commit -m "chore(helm): bump dev image tags backend=${BACKEND_NEXT} frontend=${FRONTEND_NEXT} [skip ci]"
          git push origin HEAD:develop
