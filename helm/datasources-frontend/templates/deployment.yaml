apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datasources-frontend.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "datasources-frontend.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "datasources-frontend.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "datasources-frontend.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/env-config: {{ include (print $.Template.BasePath "/configmap-env.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "datasources-frontend.serviceAccountName" . }}
      {{- with .Values.deployment.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.deployment.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          # The image's docker-entrypoint.sh reads these env vars and writes
          # /app/dist/config.js — which the SPA's index.html loads as window.ENV.
          # `API_URL` MUST be an absolute URL: the frontend builds request URLs
          # via `new URL(path, API_URL)` and `new URL` rejects relative origins
          # with "Failed to construct 'URL': Invalid URL".
          env:
            {{- range $key, $value := .Values.runtimeEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: env-config
              mountPath: /app/dist/env-config.js
              subPath: env-config.js
          {{- with .Values.deployment.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.deployment.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: env-config
          configMap:
            name: {{ include "datasources-frontend.name" . }}-env
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds | default 30 }}
